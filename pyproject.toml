[dependency-groups]
dev = [
    "commitizen>=4.16.4",
]

[project]
name = "dova"
version = "0.1.0"
description = "DOVA is a local first agentic voice assistant designed to co-exist with your system."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.138.2",
    "langchain>=1.3.11",
    "langchain-ollama>=1.1.0",
    "rich>=15.0.0",
    "websockets>=15.0.1",
]

[project.scripts]
dova = "dova.main:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]  # ← Critical: tells setuptools to look in src/

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "$version"
version_scheme = "pep440"
version_provider = "uv"
update_changelog_on_bump = true
